<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t d">
<title id="t">Departments and shared projects</title>
<desc id="d">Six departments shown as clusters of researchers. Projects form between them, drawing members from two or three departments at a time.</desc>
<defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>
.edge{fill:none;stroke:#aab3ad;stroke-width:1;stroke-dasharray:2 3;opacity:.75}
.bound{fill:none;stroke:#315bd6;stroke-opacity:.3;stroke-dasharray:2 4}
.node{fill:#f7f8f6;stroke:#1f2421;stroke-opacity:.5;stroke-width:1}
.ghost{fill:none;stroke:#315bd6;stroke-opacity:.4;stroke-dasharray:2 2}
.pin{fill:#1f2421;opacity:.5}
.sig{fill:none;stroke:#315bd6;stroke-width:1.8;stroke-linecap:round;stroke-dasharray:14 200;stroke-dashoffset:214;opacity:0;animation:sig 11.0s linear infinite}
.core{fill:#315bd6;opacity:0;animation:core 11.0s ease-in-out infinite}
.pcore{fill:#315bd6;opacity:0;animation:pcore 11.0s ease-in-out infinite}
.ring{fill:none;stroke:#315bd6;stroke-width:1;opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 11.0s ease-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
@keyframes sig{0%{stroke-dashoffset:214;opacity:0}.5%{opacity:1}5.86%{opacity:1}6.36%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:0;opacity:0}}
@keyframes core{0%{opacity:0}1.2%,14%{opacity:.95}20%,100%{opacity:0}}
@keyframes pcore{0%{opacity:0}1.2%,17%{opacity:.95}24%,100%{opacity:0}}
@keyframes ring{0%{opacity:.7;transform:scale(1)}7%,100%{opacity:0;transform:scale(2.3)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.sig{stroke-dashoffset:0;opacity:.35}.core,.pcore{opacity:.6}}
</style>

