<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t d">
<title id="t">People behind the work</title>
<desc id="d">Faculty, researchers, assistants and interns shown as groups of nodes. Mentorship passes from faculty to researchers to assistants to interns.</desc>
<defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>
text{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}
.lblb{font-size:8px;fill:#315bd6;font-weight:600;paint-order:stroke;stroke:#f5f5f4;stroke-width:3px}
.edge{fill:none;stroke:#aab3ad;stroke-width:1;stroke-dasharray:2 3;opacity:.8}
.node{fill:#f7f8f6;stroke:#1f2421;stroke-opacity:.5;stroke-width:1}
.pin{fill:#1f2421;opacity:.5}
.sig{fill:none;stroke:#315bd6;stroke-width:1.8;stroke-linecap:round;stroke-dasharray:14 200;stroke-dashoffset:214;opacity:0;animation:sig 8.0s linear infinite}
.core{fill:#315bd6;opacity:0;animation:core 8.0s ease-in-out infinite}
.ring{fill:none;stroke:#315bd6;stroke-width:1;opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 8.0s ease-out infinite}
@keyframes sig{0%{stroke-dashoffset:214;opacity:0}.6%{opacity:1}5.65%{opacity:1}6.25%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:0;opacity:0}}
@keyframes core{0%{opacity:0}1.5%,18%{opacity:.95}26%,100%{opacity:0}}
@keyframes ring{0%{opacity:.7;transform:scale(1)}9%,100%{opacity:0;transform:scale(2.3)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.sig{stroke-dashoffset:0;opacity:.35}.core{opacity:.6}}
</style>

